<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex Monitor</title>
  <script src="/preload.js"></script>
  <!--INLINE_STYLES_START-->
  <link rel="stylesheet" href="/styles.css" />
  <!--INLINE_STYLES_END-->
</head>
<body>
  <div id="app">
    <div style="max-width:1120px;margin:0 auto;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:12px;color:var(--foreground,#333)">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <strong style="font-size:14px">Codex Monitor</strong>
        <span style="font-size:11px;opacity:0.75">Loading…</span>
      </div>
      <div style="border:1px solid var(--border,rgba(127,127,127,0.22));border-radius:8px;padding:14px;opacity:0.85">
        正在初始化像素工坊与会话统计…
      </div>
    </div>
  </div>
  <script>
    (function () {
      function showEarlyError(msg) {
        if (window.__codexMonitorMounted) return;
        var root = document.getElementById('app');
        if (!root) return;
        var text = String(msg || 'Unknown startup error');
        var box = document.createElement('div');
        box.style.cssText = 'padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#ef4444;border:1px solid rgba(239,68,68,0.4);border-radius:8px;margin:10px;background:rgba(239,68,68,0.08);white-space:pre-wrap;word-break:break-word';
        box.textContent = 'Codex Monitor failed to start: ' + text;
        root.innerHTML = '';
        root.appendChild(box);
      }
      window.addEventListener('error', function (ev) {
        showEarlyError((ev && ev.error && (ev.error.stack || ev.error.message)) || (ev && ev.message));
      });
      window.addEventListener('unhandledrejection', function (ev) {
        showEarlyError(ev && ev.reason && (ev.reason.stack || ev.reason.message || ev.reason));
      });
    })();
  </script>
  <!--INLINE_SCRIPTS_START-->
  <script src="/sprites.js"></script>
  <script src="/app.js"></script>
  <!--INLINE_SCRIPTS_END-->
</body>
</html>
