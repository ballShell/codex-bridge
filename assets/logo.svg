<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-label="Codex Bridge Logo">
  <defs>
    <linearGradient id="frameBorder" x1="14" y1="14" x2="114" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="bridgeArch" x1="34" y1="54" x2="94" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Centered rounded emblem with ~11% transparent margin -->
  <rect x="14" y="14" width="100" height="100" rx="24" fill="#0F172A" stroke="url(#frameBorder)" stroke-width="3"/>

  <!-- Bridge span connecting conversational node (left) and engineering node (right) -->
  <path d="M 38 66 C 46 38, 82 38, 90 66" stroke="url(#bridgeArch)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 42 74 L 86 74" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 5"/>

  <!-- Center keystone diamond -->
  <path d="M 64 41 L 70 47 L 64 53 L 58 47 Z" fill="#F8FAFC"/>

  <!-- Left node: Gemini conversational spark -->
  <circle cx="38" cy="74" r="14" fill="#0D9488" stroke="#CCFBF1" stroke-width="2.5"/>
  <path d="M 38 66 L 40.2 71.8 L 46 74 L 40.2 76.2 L 38 82 L 35.8 76.2 L 30 74 L 35.8 71.8 Z" fill="#FFFFFF"/>

  <!-- Right node: Codex engineering code terminal -->
  <rect x="76" y="60" width="28" height="28" rx="8" fill="#D97706" stroke="#FEF3C7" stroke-width="2.5"/>
  <path d="M 85 69 L 81 74 L 85 79" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 95 69 L 99 74 L 95 79" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 91.5 68.5 L 88.5 79.5" stroke="#FEF3C7" stroke-width="2" stroke-linecap="round"/>
</svg>
